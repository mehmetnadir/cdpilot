name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # OIDC trusted publisher (npm)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Upgrade npm (OIDC trusted publisher needs >= 11.5.1)
        run: npm install -g npm@latest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python runtime deps
        run: python -m pip install websockets
      - name: Run tests
        run: npm test
        env:
          CDPILOT_PYTHON: python
      - name: Publish to npm (OIDC)
        run: npm publish --access public --provenance

      - name: Sync server.json version with package.json
        run: |
          V=$(node -p "require('./package.json').version")
          jq --arg v "$V" '.version = $v | .packages[0].version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json

      - name: Wait for npm to show the new version
        run: |
          V=$(node -p "require('./package.json').version")
          for i in $(seq 1 12); do
            if npm view cdpilot@"$V" version >/dev/null 2>&1; then
              echo "npm registry has cdpilot@$V"
              exit 0
            fi
            echo "waiting for npm registry to show cdpilot@$V ($i/12, 10s each)..."
            sleep 10
          done
          echo "Timed out waiting for cdpilot@$V on npm" >&2
          exit 1

      - name: Install mcp-publisher (pinned v1.8.1)
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
