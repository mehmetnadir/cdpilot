# Manual measurement (D-0106 condition 4): go's 30 ms settle shortcut on an idle machine.
# Runs .claude/docs/olcum/settle-t0-2.py against a headless Chrome on the runner and uploads the
# raw JSONL and the report. Not part of CI; started with `gh workflow run olcum-settle.yml`.
name: olcum-settle

on:
  workflow_dispatch:
    inputs:
      runs:
        description: 'Rounds per site (round 1 is warm-up)'
        default: '5'

permissions:
  contents: read

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install websockets
        run: python -m pip install websockets
      - name: Headless Chrome on 9333
        run: |
          google-chrome --version
          google-chrome --headless=new --remote-debugging-port=9333 --no-first-run \
            --no-default-browser-check --user-data-dir="$RUNNER_TEMP/profile" about:blank \
            > "$RUNNER_TEMP/chrome.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9333/json/version && break
            sleep 1
          done
      - name: Machine
        run: nproc; uptime
      - name: Measure
        run: python .claude/docs/olcum/settle-t0-2.py --runs "${{ inputs.runs }}" --out "$RUNNER_TEMP/kosu.jsonl"
      - name: Report
        if: always()
        run: |
          python .claude/docs/olcum/settle-t0-2.py --report --out "$RUNNER_TEMP/kosu.jsonl" --rapor "$RUNNER_TEMP/rapor.md"
          cat "$RUNNER_TEMP/rapor.md"
          uptime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settle-t0-gh
          path: |
            ${{ runner.temp }}/kosu.jsonl
            ${{ runner.temp }}/rapor.md
            ${{ runner.temp }}/chrome.log
