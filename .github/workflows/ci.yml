name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 18
            python-version: '3.10'
          - os: ubuntu-latest
            node-version: 18
            python-version: '3.11'
          - os: ubuntu-latest
            node-version: 18
            python-version: '3.12'
          - os: ubuntu-latest
            node-version: 20
            python-version: '3.10'
          - os: ubuntu-latest
            node-version: 20
            python-version: '3.11'
          - os: ubuntu-latest
            node-version: 20
            python-version: '3.12'
          - os: ubuntu-latest
            node-version: 22
            python-version: '3.10'
          - os: ubuntu-latest
            node-version: 22
            python-version: '3.11'
          - os: ubuntu-latest
            node-version: 22
            python-version: '3.12'
          - os: macos-latest
            node-version: 20
            python-version: '3.11'
          - os: windows-latest
            node-version: 20
            python-version: '3.11'

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python runtime deps
        run: python -m pip install websockets
      - name: Run npm tests
        run: npm test
        env:
          CDPILOT_PYTHON: python
      - name: Compile Python
        run: python -m py_compile src/cdpilot.py
      - name: Python version check
        run: python src/cdpilot.py --version

  # The real-browser iframe test (same-origin, cross-origin OOPIF, nested)
  # needs a headless Chrome; the ubuntu image ships google-chrome.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python runtime deps
        # cryptography: the optional Web Bot Auth dependency; its e2e test signs
        # real browser requests. The test job above keeps it absent on purpose.
        run: python -m pip install websockets cryptography
      - name: Browser
        run: google-chrome --version
      - name: Run npm tests with the browser test
        run: npm test
        env:
          CDPILOT_PYTHON: python
          CDPILOT_E2E: '1'
