<!doctype html>
<!--
  iframe fixture — smart-* page-vs-frame order and literal `>>>` selectors.
  ?child=<url>  src of iframe#child (default: widget.html, same origin).
  The page itself has: a "Sign up" link written with &nbsp;, a DISABLED
  "Submit", a "Next >>>" button (text, not a frame chain), a hidden iframe,
  and no Email field (that one lives only in the child frame).
-->
<html>
<head>
  <meta charset="utf-8">
  <title>cdpilot frames: smart</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 16px; }
    iframe#child { width: 520px; height: 260px; border: 4px solid #444; }
  </style>
</head>
<body data-log="">
  <a id="signup" href="#" onclick="log('signup'); return false">Sign&nbsp;up</a>
  <button id="submit" type="button" disabled onclick="log('submit')">Submit</button>
  <button id="next" type="button" onclick="log('next')">Next &gt;&gt;&gt;</button>
  <p id="status">idle</p>
  <iframe id="hidden-frame" src="about:blank" style="display:none"></iframe>
  <iframe id="child" title="Widget"></iframe>
  <script>
    function log(s) { document.body.dataset.log += s + ';'; }
    var q = new URLSearchParams(location.search);
    document.getElementById('child').src = q.get('child') || 'widget.html';
  </script>
</body>
</html>
