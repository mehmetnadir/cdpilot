<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Plugin Install Instructions</title>
  <style>
    body { font-family: sans-serif; padding: 30px; background: #f8f9fa; }
    h1 { color: #202124; }
    code { background: #e8eaed; padding: 4px 8px; border-radius: 4px; font-size: 16px; font-family: monospace; }
    ul { line-height: 1.8; font-size: 16px; }
  </style>
</head>
<body>
  <h1>cdpilot Plugin Installation</h1>
  <ul>
    <li>Add Marketplace: <code>/plugin marketplace add mehmetnadir/cdpilot</code></li>
    <li>Install Plugin: <code>/plugin install cdpilot@cdpilot</code></li>
    <li>Build Bundle: <code>npm run build:mcpb</code></li>
  </ul>
</body>
</html>
