<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WebMCP fixture: shop</title>
</head>
<body>
  <h1>WebMCP fixture shop</h1>
  <p id="status">Cart: 0 items</p>

  <form id="newsletter" toolname="subscribe_newsletter" tooltitle="Subscribe"
        tooldescription="Subscribe an email address to the store newsletter" toolautosubmit>
    <label>Email <input type="email" name="email" required
           toolparamdescription="Customer email address"></label>
    <button type="submit">Subscribe</button>
  </form>
  <p id="sub-status">Not subscribed</p>

  <iframe id="widget" src="frame.html" title="widget"></iframe>

  <script>
    window.__cart = [];
    window.__subscribed = null;

    document.getElementById('newsletter').addEventListener('submit', function(e) {
      e.preventDefault();
      var email = new FormData(e.target).get('email');
      window.__subscribed = email;
      document.getElementById('sub-status').textContent = 'Subscribed: ' + email;
      if (e.agentInvoked) e.respondWith(Promise.resolve({ subscribed: email }));
    });

    function track(p) {
      var regs = (window.__regs = window.__regs || []);
      regs.push(p);
      window.__registered = 'pending';
      var n = regs.length;
      Promise.all(regs.slice()).then(function() {
        if (regs.length === n) window.__registered = 'ok';
      }, function(e) { window.__registered = 'error: ' + e.name; });
    }

    if (window.isSecureContext && document.modelContext) {
      track(document.modelContext.registerTool({
        name: 'add_to_cart',
        title: 'Add to cart',
        description: 'Add a product to the shopping cart',
        inputSchema: {
          type: 'object',
          properties: {
            sku: { type: 'string', description: 'Product SKU identifier' },
            qty: { type: 'integer', description: 'Quantity to add' }
          },
          required: ['sku', 'qty']
        },
        annotations: { consequentialHint: true },
        execute: async function(input, options) {
          if (!options || !(options.signal instanceof AbortSignal)) {
            throw new TypeError('execute() was called without options.signal');
          }
          window.__cart.push({ sku: input.sku, qty: input.qty });
          document.getElementById('status').textContent =
            'Cart: ' + window.__cart.length + ' items';
          return { ok: true, sku: input.sku, qty: input.qty, cart_size: window.__cart.length };
        }
      }));

      track(document.modelContext.registerTool({
        name: 'wait_for_abort',
        description: 'Never finishes on its own; rejects when the execution is aborted',
        execute: function(input, options) {
          return new Promise(function(resolve, reject) {
            options.signal.addEventListener('abort', function() {
              reject(options.signal.reason);
            });
          });
        }
      }));
    }
  </script>
</body>
</html>
