<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Missed Click Exit Codes Demo</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    #target { position: absolute; top: 80px; left: 20px; width: 180px; height: 50px; padding: 10px; font-size: 16px; cursor: pointer; }
    #normal { position: absolute; top: 160px; left: 20px; width: 180px; height: 50px; padding: 10px; font-size: 16px; cursor: pointer; }
    #overlay { display: none; position: absolute; top: 80px; left: 20px; width: 220px; height: 80px; background: rgba(255, 0, 0, 0.8); color: white; padding: 10px; z-index: 999; }
  </style>
</head>
<body>
  <h1>Missed Click Exit Codes</h1>
  <button id="target">Open Covering Menu</button>
  <button id="normal">Normal Button</button>
  <div id="overlay">Covering Menu Overlay</div>

  <script>
    document.getElementById('target').addEventListener('mousedown', () => {
      document.getElementById('overlay').style.display = 'block';
    });
  </script>
</body>
</html>
